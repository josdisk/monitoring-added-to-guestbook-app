# Reverse proxy in front of the PHP Guestbook container.
# Public traffic hits :8080; Prometheus scrapes stub_status on :8081 via the exporter.

upstream guestbook_php {
    server 127.0.0.1:80;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://guestbook_php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8081;
    server_name _;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
